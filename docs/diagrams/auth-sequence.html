<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Authentication & Token Lifecycle · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .frame { max-width: 1080px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--color-muted);
      margin-bottom: 1.4rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Authentication Lifecycle · Diagram Design</p>
    <h1>User Login &amp; Token Rotation Flow</h1>
    <p class="subtitle">FastAPI SaaS authentication flow with Argon2 hash verification, short-lived JWT, and rotating refresh tokens.</p>

    <svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
      <title id="seq-title">User Authentication and Token Refresh Sequence</title>
      <desc id="seq-desc">Sequence diagram showing user credentials verification, access token and refresh token issuance, followed by atomic refresh token rotation.</desc>
      
      <defs>
        <!-- Dot grid background -->
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>

        <!-- Arrow markers -->
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Canvas background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- =================================================================
           LIFELINES
           Client: 140 | Router: 400 | Service: 660 | PostgreSQL: 910
           ================================================================= -->
      <line x1="140" y1="116" x2="140" y2="680" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="116" x2="400" y2="680" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="660" y1="116" x2="660" y2="680" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="910" y1="116" x2="910" y2="680" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           PHASE 1 FRAME: LOGIN & INITIAL TOKEN ISSUANCE
           ================================================================= -->
      <rect x="64" y="136" width="912" height="286" rx="4" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
      <rect x="64" y="136" width="60" height="18" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="94" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">LOGIN</text>
      <text x="136" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[credentials verification &amp; token issuance]</text>

      <!-- =================================================================
           PHASE 2 FRAME: TOKEN ROTATION
           ================================================================= -->
      <rect x="64" y="440" width="912" height="236" rx="4" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
      <rect x="64" y="440" width="76" height="18" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="102" y="453" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">ROTATION</text>
      <text x="150" y="453" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[access token expired &gt; 15m]</text>

      <!-- =================================================================
           ACTIVATION BARS
           ================================================================= -->
      <!-- Login activations -->
      <rect x="396" y="168" width="8" height="240" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="656" y="200" width="8" height="190" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="906" y="232" width="8" height="34" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="906" y="340" width="8" height="34" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Rotation activations -->
      <rect x="396" y="470" width="8" height="186" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="656" y="500" width="8" height="132" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="906" y="534" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- =================================================================
           MESSAGE ARROWS & LABELS (LOGIN PHASE)
           ================================================================= -->
      <!-- M1: Client -> Router (POST /login) -->
      <rect x="180" y="156" width="180" height="13" rx="2" fill="#f5f5f5"/>
      <text x="268" y="166" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/v1/auth/login</text>
      <line x1="140" y1="172" x2="396" y2="172" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- M2: Router -> Service (authenticate_user) -->
      <rect x="424" y="190" width="210" height="13" rx="2" fill="#f5f5f5"/>
      <text x="528" y="200" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">authenticate_user(email, password)</text>
      <line x1="404" y1="204" x2="656" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M3: Service -> DB (SELECT User) -->
      <rect x="686" y="222" width="194" height="13" rx="2" fill="#f5f5f5"/>
      <text x="782" y="232" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">SELECT User WHERE email = norm</text>
      <line x1="664" y1="236" x2="906" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M4: DB -> Service (User Record) -->
      <rect x="680" y="254" width="204" height="13" rx="2" fill="#f5f5f5"/>
      <text x="782" y="264" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">User (password_hash, is_active)</text>
      <line x1="906" y1="268" x2="664" y2="268" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M5: Service Self Loop (Verify Argon2) -->
      <path d="M 664 296 L 710 296 L 710 322 L 664 322" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="716" y="302" width="194" height="14" rx="2" fill="#f5f5f5"/>
      <text x="812" y="313" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">verify_password() [Argon2]</text>

      <!-- M6: Service -> DB (Store RefreshToken) -->
      <rect x="680" y="332" width="204" height="13" rx="2" fill="#f5f5f5"/>
      <text x="782" y="342" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">INSERT RefreshToken(token_hash)</text>
      <line x1="664" y1="346" x2="906" y2="346" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M7: Service -> Router (Tokens) -->
      <rect x="430" y="374" width="198" height="13" rx="2" fill="#f5f5f5"/>
      <text x="528" y="384" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">(access_token, refresh_token)</text>
      <line x1="656" y1="388" x2="404" y2="388" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M8: Router -> Client (200 OK TokenResponse · Accent Coral) -->
      <rect x="170" y="394" width="202" height="13" rx="2" fill="#f5f5f5"/>
      <text x="268" y="404" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 OK · {access, refresh, 900s}</text>
      <line x1="396" y1="408" x2="140" y2="408" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- =================================================================
           MESSAGE ARROWS & LABELS (ROTATION PHASE)
           ================================================================= -->
      <!-- M9: Client -> Router (POST /refresh) -->
      <rect x="176" y="460" width="186" height="13" rx="2" fill="#f5f5f5"/>
      <text x="268" y="470" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/v1/auth/refresh</text>
      <line x1="140" y1="474" x2="396" y2="474" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- M10: Router -> Service (rotate_refresh_token) -->
      <rect x="424" y="492" width="210" height="13" rx="2" fill="#f5f5f5"/>
      <text x="528" y="502" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">rotate_refresh_token(refresh_token)</text>
      <line x1="404" y1="506" x2="656" y2="506" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M11: Service -> DB (Atomic Revoke & Insert) -->
      <rect x="670" y="526" width="226" height="13" rx="2" fill="#f5f5f5"/>
      <text x="782" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REVOKE old token &amp; INSERT new token</text>
      <line x1="664" y1="540" x2="906" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M12: DB -> Service (Commit Success) -->
      <rect x="686" y="562" width="194" height="13" rx="2" fill="#f5f5f5"/>
      <text x="782" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">Tx Committed (revoked + replaced)</text>
      <line x1="906" y1="576" x2="664" y2="576" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M13: Service -> Router (New Pair) -->
      <rect x="430" y="602" width="198" height="13" rx="2" fill="#f5f5f5"/>
      <text x="528" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.05em">(new_access_token, new_refresh)</text>
      <line x1="656" y1="616" x2="404" y2="616" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M14: Router -> Client (200 OK Rotated · Accent Coral) -->
      <rect x="166" y="638" width="208" height="13" rx="2" fill="#f5f5f5"/>
      <text x="268" y="648" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 OK · Rotated TokenResponse</text>
      <line x1="396" y1="652" x2="140" y2="652" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- =================================================================
           ACTOR BOXES (TOP HEADER)
           ================================================================= -->
      <!-- Actor 1: Client -->
      <rect x="64" y="60" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="60" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="68" width="30" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="87" y="77" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="140" y="91" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client App</text>
      <text x="140" y="105" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Browser / HTTP</text>

      <!-- Actor 2: Router -->
      <rect x="324" y="60" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="324" y="60" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="332" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="348" y="77" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>
      <text x="400" y="91" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth Router</text>
      <text x="400" y="105" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI /api/v1/auth</text>

      <!-- Actor 3: Auth Service (Focal Accent) -->
      <rect x="584" y="60" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="60" width="152" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="592" y="68" width="34" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="609" y="77" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="660" y="91" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth Service</text>
      <text x="660" y="105" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Security &amp; Hash Logic</text>

      <!-- Actor 4: PostgreSQL -->
      <rect x="834" y="60" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="834" y="60" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="842" y="68" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="857" y="77" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="910" y="91" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="910" y="105" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Users &amp; Tokens Table</text>

      <!-- =================================================================
           LEGEND
           ================================================================= -->
      <line x1="64" y1="696" x2="976" y2="696" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="64" y="714" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <!-- Inbound Request (Blue) -->
      <line x1="64" y1="732" x2="88" y2="732" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="96" y="735" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">HTTP Request</text>

      <!-- Sync Call (Muted) -->
      <line x1="210" y1="732" x2="234" y2="732" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="242" y="735" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Sync Invocation / DB Query</text>

      <!-- Return (Dashed) -->
      <line x1="424" y1="732" x2="448" y2="732" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="456" y="735" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Return / Tx Result</text>

      <!-- Accent Success (Coral) -->
      <line x1="600" y1="732" x2="624" y2="732" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="632" y="735" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', monospace">Token Issued / Response</text>

      <!-- Activation box sample -->
      <rect x="806" y="727" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="822" y="735" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Execution Bar</text>
    </svg>
  </div>
</body>
</html>
