<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database ER &amp; Schema Architecture · AI Knowledge Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --color-card:    #ffffff;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Model · Entity Relationships · Diagram Design</p>
    <h1>Database Entity Relationships &amp; Multi-Tenant Hierarchy</h1>
    <p class="subtitle">Physical relational schema: Tenant IAM (Organizations, Users, Roles) cascaded into Workspaces, Knowledge Bases, and PGVector Document Chunks.</p>

    <svg viewBox="0 0 1140 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">

      <desc id="er-desc">Entity relationship diagram showing organizations, users, memberships, roles, permissions, workspaces, knowledge bases, documents, and document chunks with pgvector embedding.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Canvas background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- =================================================================
           CONTAINMENT GROUPS
           ================================================================= -->

      <!-- Right: Knowledge & Vector Cluster -->
      <rect x="550" y="40" width="550" height="680" rx="8" fill="rgba(235,108,54,0.02)" stroke="rgba(235,108,54,0.22)" stroke-dasharray="4,4"/>
      <text x="570" y="65" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#eb6c36" letter-spacing="0.12em">KNOWLEDGE &amp; PGVECTOR EMBEDDING CLUSTER</text>
