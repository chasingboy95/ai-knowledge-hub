<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Processing Pipeline Architecture · AI Knowledge Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pipeline Architecture · State Machine · Diagram Design</p>
    <h1>Document Processing &amp; Vectorization Pipeline</h1>
    <p class="subtitle">Decoupled asynchronous lifecycle: Upload, Storage Isolation, Multi-format Parsing, Recursive Chunking, and Embedding Vectorization.</p>

    <svg viewBox="0 0 1140 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipe-title pipe-desc">
      <title id="pipe-title">AI Knowledge Hub Document Ingestion Pipeline</title>
      <desc id="pipe-desc">Architecture and state machine flow of document upload, parsing, chunking, and embedding storage.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Canvas background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- =================================================================
           TOP STAGE TIMELINE / STATE MACHINE
           ================================================================= -->
      <rect x="50" y="45" width="1040" height="110" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
      <text x="70" y="70" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75" letter-spacing="0.1em">DOCUMENT LIFECYCLE STATE MACHINE</text>

      <!-- Stage 1: UPLOADED -->
      <rect x="70" y="85" width="130" height="50" rx="4" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="135" y="106" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">UPLOADED</text>
      <text x="135" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Saved to storage</text>

      <!-- Arrow 1->2 -->
      <line x1="200" y1="110" x2="250" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Stage 2: PARSING -->
      <rect x="250" y="85" width="130" height="50" rx="4" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8" stroke-width="0.8"/>
      <text x="315" y="106" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2e5aa8" text-anchor="middle">PARSING</text>
      <text x="315" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Extract plain text</text>

      <!-- Arrow 2->3 -->
      <line x1="380" y1="110" x2="430" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Stage 3: CHUNKING -->
      <rect x="430" y="85" width="130" height="50" rx="4" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8" stroke-width="0.8"/>
      <text x="495" y="106" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2e5aa8" text-anchor="middle">CHUNKING</text>
      <text x="495" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Recursive overlap</text>

      <!-- Arrow 3->4 -->
      <line x1="560" y1="110" x2="610" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Stage 4: EMBEDDING -->
      <rect x="610" y="85" width="130" height="50" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="675" y="106" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#eb6c36" text-anchor="middle">EMBEDDING</text>
      <text x="675" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Vector calculation</text>

      <!-- Arrow 4->5 -->
      <line x1="740" y1="110" x2="790" y2="110" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Stage 5: READY -->
      <rect x="790" y="85" width="130" height="50" rx="4" fill="rgba(46,125,50,0.08)" stroke="#2e7d32" stroke-width="1"/>
      <text x="855" y="106" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2e7d32" text-anchor="middle">READY</text>
      <text x="855" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Searchable in RAG</text>

      <!-- Stage 6: FAILED -->
      <rect x="950" y="85" width="120" height="50" rx="4" fill="rgba(198,40,40,0.08)" stroke="#c62828" stroke-width="0.8"/>
      <text x="1010" y="106" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#c62828" text-anchor="middle">FAILED</text>
      <text x="1010" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Error captured</text>

      <!-- Exception arrows to FAILED -->
      <path d="M 315 85 L 315 65 L 1010 65 L 1010 85" fill="none" stroke="#c62828" stroke-width="0.8" stroke-dasharray="3,3"/>

      <!-- =================================================================
           STAGE COMPONENT BLOCKS
           ================================================================= -->
      <!-- Component 1: INGESTION & STORAGE -->
      <g id="cmp-ingestion">
        <rect x="50" y="180" width="230" height="460" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
        <rect x="50" y="180" width="230" height="32" rx="6" fill="rgba(45,49,66,0.05)"/>
        <text x="65" y="201" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">1. Ingestion &amp; Storage</text>

        <!-- Subcard: Upload Route -->
        <rect x="65" y="225" width="200" height="75" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="75" y="244" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">FastAPI Upload Route</text>
        <text x="75" y="260" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2e5aa8">POST /.../documents</text>
        <text x="75" y="278" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">RBAC: document:upload</text>
        <text x="75" y="290" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Validate: size &gt; 0, filename</text>

        <!-- Subcard: StorageService -->
        <rect x="65" y="315" width="200" height="95" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="75" y="334" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">StorageService (ABC)</text>
        <text x="75" y="352" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">LocalStorageService</text>
        <text x="75" y="370" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Isolated path layout:</text>
        <text x="75" y="384" font-family="'Geist Mono', monospace" font-size="7.5" fill="#4f5d75">{org_id}/{kb_id}/{doc_id}/</text>
        <text x="75" y="398" font-family="'Geist Mono', monospace" font-size="8" fill="#2e7d32">✓ Traversal Prevention</text>

        <!-- Subcard: BackgroundTask -->
        <rect x="65" y="425" width="200" height="70" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="75" y="444" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Async Dispatch</text>
        <text x="75" y="462" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">FastAPI BackgroundTasks</text>
        <text x="75" y="480" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">process_document(doc_id)</text>
      </g>

      <!-- Component 2: PARSERS & CLEANING -->
      <g id="cmp-parsers">
        <rect x="310" y="180" width="230" height="460" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
        <rect x="310" y="180" width="230" height="32" rx="6" fill="rgba(45,49,66,0.05)"/>
        <text x="325" y="201" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">2. Parsing &amp; Cleaning</text>

        <rect x="325" y="225" width="200" height="65" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="335" y="244" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">PlainTextParser</text>
        <text x="335" y="260" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">.txt, .md, .json, .csv</text>
        <text x="335" y="276" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Normalize \r\n, strip \x00</text>

        <rect x="325" y="305" width="200" height="75" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="335" y="324" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">PDFParser (pypdf)</text>
        <text x="335" y="340" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">.pdf</text>
        <text x="335" y="356" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Page-by-page text extract</text>
        <text x="335" y="368" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Preserves page_number meta</text>

        <rect x="325" y="395" width="200" height="75" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="335" y="414" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">DocxParser (python-docx)</text>
        <text x="335" y="430" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">.docx</text>
        <text x="335" y="446" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Paragraphs &amp; tables extraction</text>
        <text x="335" y="458" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Cell text pipe-delimited</text>
      </g>

      <!-- Component 3: CHUNKING & EMBEDDING -->
      <g id="cmp-chunking">
        <rect x="570" y="180" width="250" height="460" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)" stroke-width="1"/>
        <rect x="570" y="180" width="250" height="32" rx="6" fill="rgba(45,49,66,0.05)"/>
        <text x="585" y="201" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">3. Chunking &amp; Embeddings</text>

        <!-- Recursive Chunker -->
        <rect x="585" y="225" width="220" height="110" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="595" y="244" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">RecursiveCharacterChunker</text>
        <text x="595" y="262" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2e5aa8">chunk_size: 800 chars</text>
        <text x="595" y="278" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2e5aa8">chunk_overlap: 100 chars</text>
        <text x="595" y="294" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Separators: \n\n, \n, 。, . , ' '</text>
        <text x="595" y="308" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Token estimation: len // 3</text>
        <text x="595" y="322" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Chunk metadata: page, file</text>

        <!-- Embedding Providers -->
        <rect x="585" y="350" width="220" height="120" rx="4" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.25)" stroke-width="0.8"/>
        <text x="595" y="369" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#eb6c36">EmbeddingProvider (ABC)</text>
        <text x="595" y="388" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">MockEmbeddingProvider</text>
        <text x="605" y="402" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">• SHA256 seed normalized unit vector</text>
        <text x="595" y="420" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">OpenAIEmbeddingProvider</text>
        <text x="605" y="434" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">• text-embedding-3-small (1536 dim)</text>
        <text x="605" y="448" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">• HTTP async batch with index sorting</text>
      </g>

      <!-- Component 4: VECTOR STORE & PERSISTENCE -->
      <g id="cmp-vectorstore">
        <rect x="850" y="180" width="240" height="460" rx="6" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1.2"/>
        <rect x="850" y="180" width="240" height="32" rx="6" fill="rgba(235,108,54,0.12)"/>
        <text x="865" y="201" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#eb6c36">4. Vector Store &amp; RAG</text>

        <!-- PGVectorStore -->
        <rect x="865" y="225" width="210" height="125" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="875" y="244" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">PGVectorStore (Production)</text>
        <text x="875" y="262" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2e5aa8">Table: document_chunks</text>
        <text x="875" y="278" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2e5aa8">embedding vector(1536)</text>
        <text x="875" y="294" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">HNSW Index (vector_cosine_ops)</text>
        <text x="875" y="308" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Cosine distance: &lt;=&gt;</text>
        <text x="875" y="322" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Score: max(0, 1 - distance)</text>
        <text x="875" y="336" font-family="'Geist Mono', monospace" font-size="8" fill="#2e7d32">✓ Multi-tenant SQL filters</text>

        <!-- InMemoryVectorStore -->
        <rect x="865" y="365" width="210" height="100" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="875" y="384" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">InMemoryVectorStore (Tests)</text>
        <text x="875" y="402" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">Numpy dot-product cosine sim</text>
        <text x="875" y="418" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Pure in-memory dictionary</text>
        <text x="875" y="432" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Zero external dependency</text>
        <text x="875" y="446" font-family="'Geist Mono', monospace" font-size="8" fill="#2e7d32">Fast SQLite unit tests</text>

        <!-- Reindex & Delete Consistency -->
        <rect x="865" y="480" width="210" height="90" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
        <text x="875" y="499" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Lifecycle Consistency</text>
        <text x="875" y="516" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Reindex: clear old chunks</text>
        <text x="875" y="530" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Delete Doc: purge vector store</text>
        <text x="875" y="544" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">Delete KB: purge files &amp; vectors</text>
      </g>

      <!-- Connection Arrows between columns -->
      <line x1="280" y1="360" x2="310" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="540" y1="360" x2="570" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="820" y1="360" x2="850" y2="360" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
    </svg>
  </div>
</body>
</html>
