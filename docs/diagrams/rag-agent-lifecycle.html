<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure RAG &amp; Agent Tool Execution Lifecycle · AI Knowledge Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-link:    #2e5aa8;
      --color-card:    #ffffff;
      --color-success: #2a9d8f;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.3rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .diagram-card {
      background: var(--color-card);
      border: 1px solid rgba(45, 49, 66, 0.12);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(45, 49, 66, 0.04);
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">Enterprise Autonomous Knowledge Hub · Phase 3 &amp; Phase 4</div>
    <h1>Secure RAG &amp; Agent Tool Execution Lifecycle</h1>
    <p class="subtitle">Multi-tenant boundary verification, anti-injection prompt guardrails, Function Calling ReAct loop, and Server-Sent Events stream pipeline.</p>

    <div class="diagram-card">
      <svg viewBox="0 0 1160 620" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Lanes / Subgraphs -->
        <!-- 1. Client -->
        <rect x="20" y="20" width="180" height="570" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
        <text x="110" y="50" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">CLIENT / SDK</text>

        <!-- 2. FastAPI Gateway -->
        <rect x="230" y="20" width="220" height="570" rx="6" fill="rgba(46,90,168,0.02)" stroke="rgba(46,90,168,0.15)" stroke-width="1"/>
        <text x="340" y="50" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2e5aa8" text-anchor="middle">GATEWAY &amp; ROUTER</text>

        <!-- 3. RAG & Agent Engine -->
        <rect x="480" y="20" width="370" height="570" rx="6" fill="rgba(235,108,54,0.02)" stroke="rgba(235,108,54,0.18)" stroke-width="1"/>
        <text x="665" y="50" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#eb6c36" text-anchor="middle">CORE RAG &amp; AGENT RUNNER</text>

        <!-- 4. Tools & Vector Store -->
        <rect x="880" y="20" width="260" height="570" rx="6" fill="rgba(42,157,143,0.02)" stroke="rgba(42,157,143,0.15)" stroke-width="1"/>
        <text x="1010" y="50" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2a9d8f" text-anchor="middle">TOOL REGISTRY &amp; STORAGE</text>

        <!-- Component Blocks -->
        <!-- User Query -->
        <rect x="35" y="80" width="150" height="55" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="110" y="105" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">User Chat Query</text>
        <text x="110" y="122" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">POST .../chat/stream</text>

        <!-- RBAC Guard -->
        <rect x="250" y="80" width="180" height="55" rx="5" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
        <text x="340" y="105" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2e5aa8" text-anchor="middle">RBAC &amp; Tenant Guard</text>
        <text x="340" y="122" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">require_permission</text>

        <!-- User Message Persistence -->
        <rect x="505" y="80" width="150" height="55" rx="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="580" y="105" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">Persist User Msg</text>
        <text x="580" y="122" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">chat_messages (DB)</text>

        <!-- Mode Dispatcher -->
        <polygon points="770,80 830,107 770,135 710,107" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="770" y="111" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#eb6c36" text-anchor="middle">Agent ?</text>

        <!-- Flow Line 1 -->
        <path d="M 185 107 L 250 107" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 430 107 L 505 107" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 655 107 L 710 107" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- BRANCH A: Secure RAG Path -->
        <text x="610" y="170" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75">MODE: SECURE RAG (enable_agent=false)</text>

        <!-- Secure Retrieval -->
        <rect x="505" y="190" width="160" height="60" rx="5" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
        <text x="585" y="215" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2e5aa8" text-anchor="middle">SecureRAGRetriever</text>
        <text x="585" y="235" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Workspace Boundary Filter</text>

        <!-- Vector Store -->
        <rect x="900" y="190" width="220" height="60" rx="5" fill="#ffffff" stroke="#2a9d8f" stroke-width="1"/>
        <text x="1010" y="215" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2a9d8f" text-anchor="middle">PGVectorStore (HNSW)</text>
        <text x="1010" y="235" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Cosine Dist &lt;=&gt; Sim &gt;= min_sim</text>

        <path d="M 770 135 L 770 220 L 665 220" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 665 220 L 900 220" fill="none" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Prompt Builder -->
        <rect x="505" y="280" width="160" height="60" rx="5" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="585" y="305" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#eb6c36" text-anchor="middle">PromptBuilder Guard</text>
        <text x="585" y="325" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">&lt;context_block&gt; Delimiters</text>

        <path d="M 585 250 L 585 280" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- BRANCH B: Agent Path -->
        <text x="750" y="270" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#eb6c36">MODE: AGENT (enable_agent=true)</text>

        <!-- Agent Runner ReAct -->
        <rect x="690" y="290" width="145" height="110" rx="5" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="762" y="315" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#eb6c36" text-anchor="middle">AgentRunner</text>
        <text x="762" y="335" font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">ReAct Loop (≤ 5 Steps)</text>
        <text x="762" y="355" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" text-anchor="middle">1. Tool Call Evaluation</text>
        <text x="762" y="375" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" text-anchor="middle">2. Observation Injection</text>

        <path d="M 830 107 L 860 107 L 860 345 L 835 345" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Tool Registry -->
        <rect x="900" y="290" width="220" height="110" rx="5" fill="#ffffff" stroke="#2a9d8f" stroke-width="1"/>
        <text x="1010" y="315" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2a9d8f" text-anchor="middle">ToolRegistry Execution</text>
        <text x="1010" y="338" font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">· KnowledgeSearchTool</text>
        <text x="1010" y="358" font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142" text-anchor="middle">· TicketCreateTool (IT/Ops)</text>
        <text x="1010" y="380" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" text-anchor="middle">Workspace Context Enforced</text>

        <!-- ReAct bidirectional arrow -->
        <path d="M 835 320 L 900 320" fill="none" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 900 370 L 835 370" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- LLM Generation -->
        <rect x="505" y="440" width="330" height="60" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="670" y="465" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">BaseLLMProvider (Mock / OpenAI Compatible)</text>
        <text x="670" y="485" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">stream_generate() token by token with citation references</text>

        <path d="M 585 340 L 585 440" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 762 400 L 762 440" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- SSE Streaming Response Pipeline -->
        <rect x="250" y="430" width="180" height="150" rx="5" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="340" y="455" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2e5aa8" text-anchor="middle">SSE Stream Generator</text>
        <text x="265" y="480" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">1. event: context / tool_call</text>
        <text x="265" y="502" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2a9d8f">2. event: tool_result</text>
        <text x="265" y="524" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">3. event: token (streaming)</text>
        <text x="265" y="546" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2e5aa8">4. event: message (DB saved)</text>
        <text x="265" y="568" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">5. event: done ([DONE])</text>

        <path d="M 505 470 L 430 470" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Real-time Consumer -->
        <rect x="35" y="460" width="150" height="80" rx="5" fill="#ffffff" stroke="#2a9d8f" stroke-width="1"/>
        <text x="110" y="490" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2a9d8f" text-anchor="middle">Realtime Stream Client</text>
        <text x="110" y="510" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Dynamic Citation Bubbles</text>
        <text x="110" y="526" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75" text-anchor="middle">Interactive Tool Badges</text>

        <path d="M 250 500 L 185 500" fill="none" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#arrow)"/>
      </svg>
    </div>
  </div>
</body>
</html>
