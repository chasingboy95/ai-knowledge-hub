[project]
name = "ai-knowledge-hub"
version = "0.1.0"
description = "Multi-tenant AI knowledge hub SaaS backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic[email]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pyjwt>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pypdf>=5.1,<6.0",
    "python-docx>=1.1,<2.0",
    "numpy>=1.26,<3.0",
    "pgvector>=0.3.6,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "chonkie>=1.7.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
